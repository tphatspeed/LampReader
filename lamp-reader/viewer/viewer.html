<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="pdf.title">Lamp</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(ellipse 900px 520px at 50% 0%, #232a4d 0%, #0f1220 70%);
    color: #ece6da;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 18px calc(32px + env(safe-area-inset-bottom));
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand h1 { font-family: Georgia, serif; font-size: clamp(22px, 5vw, 28px); margin: 0; font-weight: 600; }
  .brand span {
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #f2a93b;
  }
  .sub { font-size: 12.5px; color: #8b8a95; margin: 7px 0 24px; text-align: center; }

  .card {
    width: 100%;
    max-width: 560px;
    background: #1b2038;
    border: 1px solid #2a2f4a;
    border-radius: 14px;
    padding: 18px;
  }
  .drop {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 34px 16px;
    border: 1.5px dashed #2a2f4a;
    border-radius: 11px;
    background: #171b30;
    color: #8b8a95;
    font-size: 13.5px;
    cursor: pointer;
    text-align: center;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: #f2a93b; background: #1d2340; color: #ece6da; }
  .drop strong { color: #ece6da; font-weight: 600; font-size: 14px; }
  .drop small { font-size: 11.5px; }
  input[type="file"] { display: none; }

  .status {
    font-size: 12px;
    color: #8b8a95;
    margin-top: 13px;
    min-height: 18px;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .status.err { color: #e06b6b; }

  .bar {
    height: 3px;
    width: 100%;
    background: #171b30;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 11px;
    display: none;
  }
  .bar.on { display: block; }
  .bar i { display: block; height: 100%; width: 0%; background: #f2a93b; transition: width .12s linear; }

  .note {
    max-width: 560px;
    font-size: 11.5px;
    color: #6f6e7a;
    line-height: 1.65;
    margin-top: 18px;
    text-align: center;
  }
  .note b { color: #8b8a95; }
</style>
</head>
<body>
  <div class="brand">
    <h1>Lamp</h1>
    <span>PDF · EPUB</span>
  </div>
  <div class="sub" data-i18n="pdf.sub"></div>

  <div class="card">
    <label class="drop" id="drop">
      <strong data-i18n="pdf.pick"></strong>
      <small data-i18n="pdf.drop"></small>
      <input type="file" id="file" accept="application/pdf,.pdf,application/epub+zip,.epub">
    </label>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="status" id="status" data-i18n="pdf.none"></div>
  </div>

  <div class="note" data-i18n="pdf.note"></div>

  <script src="../content/defaults.js"></script>
  <script src="../content/i18n.js"></script>
  <script src="../content/epub.js"></script>
  <script src="../content/engine.js"></script>
  <script src="../content/reader.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
