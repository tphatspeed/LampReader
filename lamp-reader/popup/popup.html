<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body {
    width: 300px;
    margin: 0;
    padding: 18px;
    background: #0e1220;
    color: #ece7dd;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand h1 { font-family: Georgia, serif; font-size: 20px; margin: 0; font-weight: 600; }
  .brand span {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #f2a93b;
  }
  .sub { font-size: 12px; color: #8c8fa3; margin: 5px 0 16px; line-height: 1.5; }

  button.start, button.pdf {
    width: 100%;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: transform .08s, border-color .15s, background .15s;
  }
  button.start:active, button.pdf:active { transform: scale(.985); }

  button.start {
    padding: 13px;
    border: none;
    background: #f2a93b;
    color: #1a1206;
    font-size: 14.5px;
    font-weight: 600;
  }
  button.pdf {
    margin-top: 9px;
    padding: 12px;
    border: 1px solid #2c3252;
    background: #1a1f36;
    color: #ece7dd;
    font-size: 13.5px;
    font-weight: 500;
  }
  button.pdf:hover { border-color: #f2a93b; background: #232945; }

  .err { color: #e06b6b; font-size: 12px; margin-top: 9px; min-height: 15px; line-height: 1.45; }

  .panel {
    margin-top: 14px;
    padding: 14px;
    background: #1a1f36;
    border: 1px solid #2c3252;
    border-radius: 14px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .row + .row { margin-top: 11px; }
  .row-label { font-size: 13px; color: #8c8fa3; }

  .stepper-box {
    display: flex;
    align-items: center;
    background: #0e1220;
    border: 1px solid #2c3252;
    border-radius: 11px;
    overflow: hidden;
  }
  .stepper-box button {
    width: 38px; height: 38px;
    border: none;
    background: transparent;
    color: #ece7dd;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
  }
  .stepper-box button:hover { background: #232945; color: #f2a93b; }
  .stepper-box .val {
    min-width: 64px;
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border-left: 1px solid #2c3252;
    border-right: 1px solid #2c3252;
    font-variant-numeric: tabular-nums;
  }
  .stepper-box .val b { font-size: 15px; font-weight: 600; }
  .stepper-box .val em { font-style: normal; font-size: 10px; color: #8c8fa3; }

  .foot {
    margin-top: 13px;
    font-size: 11.5px;
    color: #6f7286;
    line-height: 1.65;
  }
  .foot b { color: #8c8fa3; font-weight: 600; }

  /* ---- Thư viện: đang đọc dở ---- */
  .sec-label {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: #6f7286; margin: 16px 0 8px;
  }
  .sec-label button {
    border: none; background: none; color: #6f7286; cursor: pointer;
    font-size: 10.5px; letter-spacing: .06em; text-transform: none; padding: 0;
  }
  .sec-label button:hover { color: #e06b6b; }
  .lib { display: flex; flex-direction: column; gap: 4px; }
  .lib-item {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 9px 10px; border: 1px solid #2c3252; border-radius: 10px;
    background: #1a1f36; color: #ece7dd; cursor: pointer; text-align: left;
    font-family: inherit; font-size: 12.5px;
  }
  .lib-item:hover { border-color: #f2a93b; background: #232945; }
  .lib-main { flex: 1; min-width: 0; }
  .lib-title {
    display: block; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; line-height: 1.35;
  }
  .lib-meta { display: block; font-size: 10.5px; color: #8c8fa3; margin-top: 3px; }
  .lib-ring { flex: none; font-size: 11px; color: #f2a93b; font-variant-numeric: tabular-nums; }
  .lib-del {
    flex: none; width: 24px; height: 24px; border: none; border-radius: 6px;
    background: transparent; color: #6f7286; cursor: pointer; font-size: 15px; line-height: 1;
  }
  .lib-del:hover { background: #2c3252; color: #e06b6b; }
  .lib-empty { font-size: 11.5px; color: #6f7286; line-height: 1.6; }

  /* ---- Hàng cấp quyền ---- */
  .perm {
    display: flex; align-items: center; gap: 10px; margin-top: 14px;
    padding: 11px 12px; border: 1px solid #2c3252; border-radius: 11px; background: #1a1f36;
  }
  .perm-text { flex: 1; font-size: 11.5px; color: #8c8fa3; line-height: 1.5; }
  .perm-text b { display: block; color: #ece7dd; font-size: 12.5px; margin-bottom: 2px; font-weight: 600; }
  .perm-btn {
    flex: none; padding: 7px 12px; border-radius: 8px; border: 1px solid #2c3252;
    background: #0e1220; color: #ece7dd; font-family: inherit; font-size: 11.5px; cursor: pointer;
  }
  .perm-btn:hover { border-color: #f2a93b; }
  .perm.on { border-color: #2f5d3a; }
  .perm.on .perm-btn { color: #8c8fa3; }
</style>
</head>
<body>
  <div class="brand">
    <h1>Lamp</h1>
    <span>RSVP</span>
  </div>
  <div class="sub" data-i18n="pop.sub"></div>

  <button class="start" id="start" data-i18n="pop.start"></button>
  <button class="pdf" id="openPdf" data-i18n="pop.pdf"></button>
  <div class="err" id="err"></div>

  <div class="panel">
    <div class="row">
      <span class="row-label" data-i18n="dock.speed"></span>
      <div class="stepper-box">
        <button data-step="wpm:-1" data-i18n-aria="a11y.dec|dock.speed">−</button>
        <span class="val"><b id="wpmVal">350</b><em>WPM</em></span>
        <button data-step="wpm:1" data-i18n-aria="a11y.inc|dock.speed">+</button>
      </div>
    </div>
    <div class="row">
      <span class="row-label" data-i18n="dock.chunk"></span>
      <div class="stepper-box">
        <button data-step="chunk:-1" data-i18n-aria="a11y.dec|dock.chunk">−</button>
        <span class="val"><b id="chunkVal">1</b></span>
        <button data-step="chunk:1" data-i18n-aria="a11y.inc|dock.chunk">+</button>
      </div>
    </div>
    <div class="row">
      <span class="row-label" data-i18n="dock.size"></span>
      <div class="stepper-box">
        <button data-step="size:-1" data-i18n-aria="a11y.dec|dock.size">−</button>
        <span class="val"><b id="sizeVal">56</b><em>px</em></span>
        <button data-step="size:1" data-i18n-aria="a11y.inc|dock.size">+</button>
      </div>
    </div>
  </div>

  <div class="sec-label">
    <span data-i18n="pop.libTitle"></span>
    <button id="libClear" hidden data-i18n="btn.clearAll"></button>
  </div>
  <div class="lib" id="lib"></div>

  <div class="perm" id="perm">
    <div class="perm-text">
      <b data-i18n="pop.permTitle"></b>
      <span id="permDesc"></span>
    </div>
    <button class="perm-btn" id="permBtn"></button>
  </div>

  <div class="foot" data-i18n-html="pop.foot"></div>

  <script src="../content/defaults.js"></script>
  <script src="../content/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
